<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tezkor baholash</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #F7F5F2);
    --secondary-bg: var(--tg-theme-secondary-bg-color, #EFEBE4);
    --text: var(--tg-theme-text-color, #1C1C1E);
    --hint: var(--tg-theme-hint-color, #8E8E93);
    --accent: var(--tg-theme-button-color, #2AA37A);
    --accent-text: var(--tg-theme-button-text-color, #FFFFFF);
    --correct: #2AA37A;
    --correct-bg: #E3F3EC;
    --wrong: #D64545;
    --wrong-bg: #FBE9E9;
    --unanswered: #9AA0A6;
    --unanswered-bg: #EEEFF1;
    --border: #DEDAD1;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overscroll-behavior: none;
  }

  .topbar {
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 30;
  }

  .topbar h1 {
    font-size: 17px;
    font-weight: 700;
    margin: 0 0 2px;
  }

  .topbar .sub {
    font-size: 13px;
    color: var(--hint);
  }

  .legend {
    display: flex;
    gap: 14px;
    padding: 10px 16px;
    font-size: 12px;
    color: var(--hint);
    align-items: center;
    flex-wrap: wrap;
  }

  .legend .dot {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 3px;
    margin-right: 4px;
    vertical-align: middle;
  }

  .actions {
    display: flex;
    gap: 8px;
    padding: 0 16px 10px;
  }

  .actions button {
    flex: 1;
    padding: 9px 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--secondary-bg);
    color: var(--text);
    font-size: 12.5px;
    font-weight: 600;
  }

  .grid-wrap {
    overflow: auto;
    max-width: 100vw;
    padding-bottom: 90px;
  }

  table {
    border-collapse: separate;
    border-spacing: 0;
  }

  th, td {
    padding: 0;
    text-align: center;
  }

  thead th {
    position: sticky;
    top: 0;
    background: var(--secondary-bg);
    font-size: 11px;
    font-weight: 600;
    color: var(--hint);
    height: 30px;
    min-width: 30px;
    border-bottom: 1px solid var(--border);
    z-index: 15;
  }

  thead th.corner {
    left: 0;
    z-index: 25;
    position: sticky;
  }

  tbody th {
    position: sticky;
    left: 0;
    background: var(--bg);
    z-index: 10;
    padding: 4px 8px 4px 12px;
    border-bottom: 1px solid var(--border);
    border-right: 1px solid var(--border);
    text-align: left;
  }

  tbody th input {
    width: 128px;
    max-width: 34vw;
    border: none;
    background: transparent;
    color: var(--text);
    font-size: 13px;
    font-weight: 600;
    padding: 6px 4px;
    border-radius: 6px;
  }

  tbody th input:focus {
    outline: 2px solid var(--accent);
    background: var(--secondary-bg);
  }

  td.cell-td {
    border-bottom: 1px solid var(--border);
    padding: 2px;
  }

  .cell {
    width: 30px;
    height: 30px;
    border-radius: 8px;
    border: none;
    font-size: 14px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.08s ease;
  }

  .cell:active {
    transform: scale(0.85);
  }

  .cell.st-1 { background: var(--correct-bg); color: var(--correct); }
  .cell.st-0 { background: var(--wrong-bg); color: var(--wrong); }
  .cell.st-N { background: var(--unanswered-bg); color: var(--unanswered); }

  .rownum {
    font-size: 10px;
    color: var(--hint);
    padding-left: 12px;
  }

  .footer-space { height: 20px; }

  .empty-state {
    padding: 40px 20px;
    text-align: center;
    color: var(--hint);
  }
</style>
</head>
<body>

<div class="topbar">
  <h1 id="className">Tezkor baholash</h1>
  <div class="sub" id="metaLine">yuklanmoqda...</div>
</div>

<div class="legend">
  <span><span class="dot" style="background:var(--correct)"></span>To'g'ri</span>
  <span><span class="dot" style="background:var(--wrong)"></span>Xato</span>
  <span><span class="dot" style="background:var(--unanswered)"></span>Javobsiz</span>
</div>

<div class="actions">
  <button id="resetAllBtn">Hammasini to'g'ri qilish</button>
</div>

<div class="grid-wrap" id="gridWrap">
  <div class="empty-state">Yuklanmoqda...</div>
</div>

<script>
(function () {
  const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;

  // ============ Rasch modeli (rasch.py bilan bir xil JMLE algoritmi) ============
  function raschProb(theta, b) {
    const x = theta - b;
    if (x > 30) return 1.0;
    if (x < -30) return 0.0;
    const e = Math.exp(x);
    return e / (1 + e);
  }

  function estimateRasch(X, maxIter = 200, tol = 1e-3) {
    const nStudents = X.length;
    const nItems = nStudents ? X[0].length : 0;

    const personMax = X.map(row => row.filter(v => v !== null).length);
    const personScore = X.map(row => row.reduce((s, v) => s + (v !== null ? v : 0), 0));
    const itemMax = Array(nItems).fill(0).map((_, i) => X.filter(row => row[i] !== null).length);
    const itemScore = Array(nItems).fill(0).map((_, i) => X.reduce((s, row) => s + (row[i] !== null ? row[i] : 0), 0));

    const excludedStudents = [];
    const activeStudents = [];
    for (let n = 0; n < nStudents; n++) {
      if (personMax[n] === 0 || personScore[n] === 0 || personScore[n] === personMax[n]) excludedStudents.push(n);
      else activeStudents.push(n);
    }
    const excludedItems = [];
    const activeItems = [];
    for (let i = 0; i < nItems; i++) {
      if (itemMax[i] === 0 || itemScore[i] === 0 || itemScore[i] === itemMax[i]) excludedItems.push(i);
      else activeItems.push(i);
    }

    const activePersonTarget = Array(nStudents).fill(0);
    const activePersonN = Array(nStudents).fill(0);
    for (const n of activeStudents) for (const i of activeItems) {
      const v = X[n][i];
      if (v !== null) { activePersonTarget[n] += v; activePersonN[n] += 1; }
    }
    const activeItemTarget = Array(nItems).fill(0);
    const activeItemN = Array(nItems).fill(0);
    for (const i of activeItems) for (const n of activeStudents) {
      const v = X[n][i];
      if (v !== null) { activeItemTarget[i] += v; activeItemN[i] += 1; }
    }

    let theta = Array(nStudents).fill(0.0);
    let b = Array(nItems).fill(0.0);
    for (const n of activeStudents) {
      if (activePersonN[n] === 0) continue;
      let p = Math.min(Math.max(activePersonTarget[n] / activePersonN[n], 0.02), 0.98);
      theta[n] = Math.log(p / (1 - p));
    }
    for (const i of activeItems) {
      if (activeItemN[i] === 0) continue;
      let p = Math.min(Math.max(activeItemTarget[i] / activeItemN[i], 0.02), 0.98);
      b[i] = -Math.log(p / (1 - p));
    }

    for (let iter = 0; iter < maxIter; iter++) {
      let maxChange = 0.0;
      const newTheta = theta.slice();
      for (const n of activeStudents) {
        const row = X[n];
        let expScore = 0.0, info = 0.0;
        for (const i of activeItems) {
          const v = row[i];
          if (v === null) continue;
          const p = raschProb(theta[n], b[i]);
          expScore += p; info += p * (1 - p);
        }
        if (info < 1e-6) continue;
        let delta = Math.max(Math.min((activePersonTarget[n] - expScore) / info, 2.0), -2.0);
        newTheta[n] = theta[n] + delta;
        maxChange = Math.max(maxChange, Math.abs(delta));
      }
      theta = newTheta;

      const newB = b.slice();
      for (const i of activeItems) {
        let expScore = 0.0, info = 0.0;
        for (const n of activeStudents) {
          const v = X[n][i];
          if (v === null) continue;
          const p = raschProb(theta[n], b[i]);
          expScore += p; info += p * (1 - p);
        }
        if (info < 1e-6) continue;
        let delta = Math.max(Math.min((expScore - activeItemTarget[i]) / info, 2.0), -2.0);
        newB[i] = b[i] + delta;
        maxChange = Math.max(maxChange, Math.abs(delta));
      }
      b = newB;

      if (activeItems.length) {
        const meanB = activeItems.reduce((s, i) => s + b[i], 0) / activeItems.length;
        for (const i of activeItems) b[i] -= meanB;
      }
      if (maxChange < tol) break;
    }

    return { theta, b, meta: { excludedStudents, excludedItems, personScore, personMax, itemScore, itemMax } };
  }

  function thetaToScaledScore(theta, thetaMin = -4.0, thetaMax = 4.0) {
    const t = Math.max(Math.min(theta, thetaMax), thetaMin);
    return ((t - thetaMin) / (thetaMax - thetaMin)) * 100;
  }

  function scoreToDaraja(s) {
    if (s >= 70) return "A+";
    if (s >= 65) return "A";
    if (s >= 60) return "B+";
    if (s >= 55) return "B";
    if (s >= 50) return "C+";
    if (s >= 46) return "C";
    return "—";
  }
  // ============ /Rasch modeli ============

  // --- Parametrlarni URL'dan olish ---
  const params = new URLSearchParams(window.location.search);
  const nStudents = Math.max(1, Math.min(200, parseInt(params.get('students') || '17', 10)));
  const nItems = Math.max(1, Math.min(200, parseInt(params.get('items') || '55', 10)));
  const className = params.get('class') ? decodeURIComponent(params.get('class')) : "Test";

  document.getElementById('className').textContent = className;
  document.getElementById('metaLine').textContent = `${nStudents} o'quvchi, ${nItems} savol — barchasi "to'g'ri" holatida boshlanadi, faqat xato/javobsizlarni bosing`;

  // --- Holat: har bir o'quvchi uchun ism va javoblar massivi ---
  const state = {
    names: Array.from({ length: nStudents }, (_, i) => `O'quvchi ${i + 1}`),
    answers: Array.from({ length: nStudents }, () => Array(nItems).fill('1')),
  };

  function nextState(s) {
    if (s === '1') return '0';
    if (s === '0') return 'N';
    return '1';
  }

  function cellClass(s) {
    return 'cell st-' + s;
  }

  function cellLabel(s) {
    if (s === '1') return '✓';
    if (s === '0') return '✕';
    return '—';
  }

  // --- Jadvalni chizish ---
  function render() {
    const wrap = document.getElementById('gridWrap');
    wrap.innerHTML = '';

    const table = document.createElement('table');

    // thead
    const thead = document.createElement('thead');
    const headRow = document.createElement('tr');
    const corner = document.createElement('th');
    corner.className = 'corner';
    corner.textContent = 'Ism';
    headRow.appendChild(corner);
    for (let q = 1; q <= nItems; q++) {
      const th = document.createElement('th');
      th.textContent = q;
      headRow.appendChild(th);
    }
    thead.appendChild(headRow);
    table.appendChild(thead);

    // tbody
    const tbody = document.createElement('tbody');
    for (let r = 0; r < nStudents; r++) {
      const tr = document.createElement('tr');

      const nameTh = document.createElement('th');
      const input = document.createElement('input');
      input.value = state.names[r];
      input.addEventListener('input', (e) => {
        state.names[r] = e.target.value;
      });
      nameTh.appendChild(input);
      tr.appendChild(nameTh);

      for (let c = 0; c < nItems; c++) {
        const td = document.createElement('td');
        td.className = 'cell-td';
        const btn = document.createElement('button');
        const s = state.answers[r][c];
        btn.className = cellClass(s);
        btn.textContent = cellLabel(s);
        btn.addEventListener('click', () => {
          const newState = nextState(state.answers[r][c]);
          state.answers[r][c] = newState;
          btn.className = cellClass(newState);
          btn.textContent = cellLabel(newState);
        });
        td.appendChild(btn);
        tr.appendChild(td);
      }
      tbody.appendChild(tr);
    }
    table.appendChild(tbody);
    wrap.appendChild(table);

    const spacer = document.createElement('div');
    spacer.className = 'footer-space';
    wrap.appendChild(spacer);
  }

  render();

  // --- "Hammasini to'g'ri qilish" ---
  document.getElementById('resetAllBtn').addEventListener('click', () => {
    state.answers = Array.from({ length: nStudents }, () => Array(nItems).fill('1'));
    render();
  });

  // --- Ma'lumotni yig'ish va yuborish ---
  function buildPayload() {
    return {
      class: className,
      n_items: nItems,
      students: state.names.map((name, i) => ({
        name: name && name.trim() ? name.trim() : `O'quvchi ${i + 1}`,
        answers: state.answers[i].join(''),
      })),
    };
  }

  function showCopyFallback(json) {
    const wrap = document.getElementById('gridWrap');
    const box = document.createElement('div');
    box.style.cssText = 'margin:16px;padding:16px;background:var(--secondary-bg);border-radius:12px;';

    const title = document.createElement('div');
    title.style.cssText = 'font-weight:700;font-size:14px;margin-bottom:8px;';
    title.textContent = "Endi shu matnni nusxalab, botga xabar sifatida yuboring:";
    box.appendChild(title);

    const textarea = document.createElement('textarea');
    textarea.value = json;
    textarea.readOnly = true;
    textarea.style.cssText = 'width:100%;height:100px;font-size:11px;font-family:monospace;padding:8px;border-radius:8px;border:1px solid var(--border);box-sizing:border-box;';
    box.appendChild(textarea);

    const copyBtn = document.createElement('button');
    copyBtn.textContent = 'Nusxalash';
    copyBtn.style.cssText = 'margin-top:10px;width:100%;padding:12px;border-radius:10px;border:none;background:var(--accent);color:var(--accent-text);font-weight:700;font-size:14px;';
    copyBtn.addEventListener('click', () => {
      textarea.select();
      textarea.setSelectionRange(0, textarea.value.length);
      const done = () => {
        copyBtn.textContent = 'Nusxalandi ✓';
        setTimeout(() => { copyBtn.textContent = 'Nusxalash'; }, 1500);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(json).then(done).catch(() => { document.execCommand('copy'); done(); });
      } else {
        document.execCommand('copy'); done();
      }
    });
    box.appendChild(copyBtn);

    const hint = document.createElement('div');
    hint.style.cssText = 'margin-top:8px;font-size:12px;color:var(--hint);';
    hint.textContent = "Nusxalagach, botingiz bilan suhbatga qaytib, shu matnni oddiy xabar sifatida joylab (paste qilib) yuboring.";
    box.appendChild(hint);

    wrap.prepend(box);
    if (typeof box.scrollIntoView === 'function') {
      box.scrollIntoView({ behavior: 'smooth' });
    }
  }

  function buildPayload() {
    return {
      class: className,
      n_items: nItems,
      students: state.names.map((name, i) => ({
        name: name && name.trim() ? name.trim() : `O'quvchi ${i + 1}`,
        answers: state.answers[i].join(''),
      })),
    };
  }

  function sendToBot() {
    const payload = buildPayload();
    const json = JSON.stringify(payload);
    if (tg) {
      tg.sendData(json);
      // Telegram bu chaqiruvdan keyin ilovani o'zi yopadi.
    } else {
      showCopyFallback(json);
    }
  }

  // --- Natijalar ekranini chizish (Yakunlash bosilgach) ---
  function showResults() {
    const payload = buildPayload();

    // JS'dagi mahalliy Rasch hisob-kitobi (bot tomonidagi Python bilan bir xil)
    const X = payload.students.map(s =>
      Array.from(s.answers).map(ch => (ch === '1' ? 1 : ch === '0' ? 0 : null))
    );
    const { theta, meta } = estimateRasch(X);

    const rows = payload.students.map((s, i) => {
      const excluded = meta.excludedStudents.includes(i);
      const score = excluded ? null : thetaToScaledScore(theta[i]);
      return {
        name: s.name,
        raw: meta.personScore[i],
        max: meta.personMax[i],
        score,
        daraja: excluded ? null : scoreToDaraja(score),
      };
    });
    rows.sort((a, b) => (b.score ?? -999) - (a.score ?? -999));

    const wrap = document.getElementById('gridWrap');
    wrap.innerHTML = '';

    const box = document.createElement('div');
    box.style.cssText = 'padding:14px 16px;';

    const title = document.createElement('div');
    title.style.cssText = 'font-size:15px;font-weight:700;margin-bottom:10px;';
    title.textContent = `Natijalar (${className})`;
    box.appendChild(title);

    for (const r of rows) {
      const row = document.createElement('div');
      row.style.cssText = 'display:flex;justify-content:space-between;align-items:center;padding:10px 12px;margin-bottom:6px;background:var(--secondary-bg);border-radius:10px;';

      const left = document.createElement('div');
      left.style.cssText = 'font-size:13.5px;font-weight:600;';
      left.textContent = r.name;

      const right = document.createElement('div');
      right.style.cssText = 'font-size:13px;text-align:right;';
      if (r.score === null) {
        right.style.color = 'var(--hint)';
        right.textContent = `${r.raw}/${r.max} — hisoblanmadi`;
      } else {
        right.innerHTML = `${r.raw}/${r.max} &nbsp; <b>${r.score.toFixed(1)}</b> (${r.daraja})`;
      }

      row.appendChild(left);
      row.appendChild(right);
      box.appendChild(row);
    }

    const note = document.createElement('div');
    note.style.cssText = 'margin-top:12px;font-size:12px;color:var(--hint);text-align:center;';
    note.textContent = 'Botga yuborilmoqda...';
    box.appendChild(note);

    wrap.appendChild(box);
  }

  render();

  // --- "Hammasini to'g'ri qilish" ---
  document.getElementById('resetAllBtn').addEventListener('click', () => {
    state.answers = Array.from({ length: nStudents }, () => Array(nItems).fill('1'));
    render();
  });

  // --- Yakunlash: avval natijani ko'rsatadi, keyin qisqa pauzadan so'ng
  //     avtomatik botga yuboradi (Telegram sendData chaqirilgach ilovani
  //     o'zi yopib qo'yadi — buni o'zgartirib bo'lmaydi).
  function finish() {
    showResults();
    if (tg) {
      tg.MainButton.hide();
      setTimeout(sendToBot, 1400);
    } else {
      // Telegram tashqarisida — darhol matnli natijani ko'rsatamiz
      sendToBot();
    }
  }

  if (tg) {
    tg.ready();
    tg.expand();
    tg.MainButton.setText('Yakunlash');
    tg.MainButton.show();
    tg.MainButton.onClick(finish);
  } else {
    const btn = document.createElement('button');
    btn.textContent = 'Yakunlash';
    btn.style.cssText = 'position:fixed;bottom:12px;left:16px;right:16px;padding:14px;border-radius:12px;border:none;background:var(--accent);color:var(--accent-text);font-weight:700;font-size:15px;z-index:40;';
    btn.addEventListener('click', finish);
    document.body.appendChild(btn);
  }
})();
</script>

</body>
</html>
