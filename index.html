<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tezkor baholash</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #F7F5F2);
    --secondary-bg: var(--tg-theme-secondary-bg-color, #EFEBE4);
    --text: var(--tg-theme-text-color, #1C1C1E);
    --hint: var(--tg-theme-hint-color, #8E8E93);
    --accent: var(--tg-theme-button-color, #2AA37A);
    --accent-text: var(--tg-theme-button-text-color, #FFFFFF);
    --correct: #2AA37A;
    --correct-bg: #E3F3EC;
    --wrong: #D64545;
    --wrong-bg: #FBE9E9;
    --unanswered: #9AA0A6;
    --unanswered-bg: #EEEFF1;
    --border: #DEDAD1;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overscroll-behavior: none;
  }

  .topbar {
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 30;
  }

  .topbar h1 {
    font-size: 17px;
    font-weight: 700;
    margin: 0 0 2px;
  }

  .topbar .sub {
    font-size: 13px;
    color: var(--hint);
  }

  .legend {
    display: flex;
    gap: 14px;
    padding: 10px 16px;
    font-size: 12px;
    color: var(--hint);
    align-items: center;
    flex-wrap: wrap;
  }

  .legend .dot {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 3px;
    margin-right: 4px;
    vertical-align: middle;
  }

  .actions {
    display: flex;
    gap: 8px;
    padding: 0 16px 10px;
  }

  .actions button {
    flex: 1;
    padding: 9px 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--secondary-bg);
    color: var(--text);
    font-size: 12.5px;
    font-weight: 600;
  }

  .grid-wrap {
    overflow: auto;
    max-width: 100vw;
    padding-bottom: 90px;
  }

  table {
    border-collapse: separate;
    border-spacing: 0;
  }

  th, td {
    padding: 0;
    text-align: center;
  }

  thead th {
    position: sticky;
    top: 0;
    background: var(--secondary-bg);
    font-size: 11px;
    font-weight: 600;
    color: var(--hint);
    height: 30px;
    min-width: 30px;
    border-bottom: 1px solid var(--border);
    z-index: 15;
  }

  thead th.corner {
    left: 0;
    z-index: 25;
    position: sticky;
  }

  tbody th {
    position: sticky;
    left: 0;
    background: var(--bg);
    z-index: 10;
    padding: 4px 8px 4px 12px;
    border-bottom: 1px solid var(--border);
    border-right: 1px solid var(--border);
    text-align: left;
  }

  tbody th input {
    width: 128px;
    max-width: 34vw;
    border: none;
    background: transparent;
    color: var(--text);
    font-size: 13px;
    font-weight: 600;
    padding: 6px 4px;
    border-radius: 6px;
  }

  tbody th input:focus {
    outline: 2px solid var(--accent);
    background: var(--secondary-bg);
  }

  td.cell-td {
    border-bottom: 1px solid var(--border);
    padding: 2px;
  }

  .cell {
    width: 30px;
    height: 30px;
    border-radius: 8px;
    border: none;
    font-size: 14px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.08s ease;
  }

  .cell:active {
    transform: scale(0.85);
  }

  .cell.st-1 { background: var(--correct-bg); color: var(--correct); }
  .cell.st-0 { background: var(--wrong-bg); color: var(--wrong); }
  .cell.st-N { background: var(--unanswered-bg); color: var(--unanswered); }

  .rownum {
    font-size: 10px;
    color: var(--hint);
    padding-left: 12px;
  }

  .footer-space { height: 20px; }

  .empty-state {
    padding: 40px 20px;
    text-align: center;
    color: var(--hint);
  }
</style>
</head>
<body>

<div class="topbar">
  <h1 id="className">Tezkor baholash</h1>
  <div class="sub" id="metaLine">yuklanmoqda...</div>
</div>

<div class="legend">
  <span><span class="dot" style="background:var(--correct)"></span>To'g'ri</span>
  <span><span class="dot" style="background:var(--wrong)"></span>Xato</span>
  <span><span class="dot" style="background:var(--unanswered)"></span>Javobsiz</span>
</div>

<div class="actions">
  <button id="resetAllBtn">Hammasini to'g'ri qilish</button>
</div>

<div class="grid-wrap" id="gridWrap">
  <div class="empty-state">Yuklanmoqda...</div>
</div>

<script>
(function () {
  const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;

  // --- Parametrlarni URL'dan olish ---
  const params = new URLSearchParams(window.location.search);
  const nStudents = Math.max(1, Math.min(200, parseInt(params.get('students') || '17', 10)));
  const nItems = Math.max(1, Math.min(200, parseInt(params.get('items') || '55', 10)));
  const className = params.get('class') ? decodeURIComponent(params.get('class')) : "Test";

  document.getElementById('className').textContent = className;
  document.getElementById('metaLine').textContent = `${nStudents} o'quvchi, ${nItems} savol — barchasi "to'g'ri" holatida boshlanadi, faqat xato/javobsizlarni bosing`;

  // --- Holat: har bir o'quvchi uchun ism va javoblar massivi ---
  const state = {
    names: Array.from({ length: nStudents }, (_, i) => `O'quvchi ${i + 1}`),
    answers: Array.from({ length: nStudents }, () => Array(nItems).fill('1')),
  };

  function nextState(s) {
    if (s === '1') return '0';
    if (s === '0') return 'N';
    return '1';
  }

  function cellClass(s) {
    return 'cell st-' + s;
  }

  function cellLabel(s) {
    if (s === '1') return '✓';
    if (s === '0') return '✕';
    return '—';
  }

  // --- Jadvalni chizish ---
  function render() {
    const wrap = document.getElementById('gridWrap');
    wrap.innerHTML = '';

    const table = document.createElement('table');

    // thead
    const thead = document.createElement('thead');
    const headRow = document.createElement('tr');
    const corner = document.createElement('th');
    corner.className = 'corner';
    corner.textContent = 'Ism';
    headRow.appendChild(corner);
    for (let q = 1; q <= nItems; q++) {
      const th = document.createElement('th');
      th.textContent = q;
      headRow.appendChild(th);
    }
    thead.appendChild(headRow);
    table.appendChild(thead);

    // tbody
    const tbody = document.createElement('tbody');
    for (let r = 0; r < nStudents; r++) {
      const tr = document.createElement('tr');

      const nameTh = document.createElement('th');
      const input = document.createElement('input');
      input.value = state.names[r];
      input.addEventListener('input', (e) => {
        state.names[r] = e.target.value;
      });
      nameTh.appendChild(input);
      tr.appendChild(nameTh);

      for (let c = 0; c < nItems; c++) {
        const td = document.createElement('td');
        td.className = 'cell-td';
        const btn = document.createElement('button');
        const s = state.answers[r][c];
        btn.className = cellClass(s);
        btn.textContent = cellLabel(s);
        btn.addEventListener('click', () => {
          const newState = nextState(state.answers[r][c]);
          state.answers[r][c] = newState;
          btn.className = cellClass(newState);
          btn.textContent = cellLabel(newState);
        });
        td.appendChild(btn);
        tr.appendChild(td);
      }
      tbody.appendChild(tr);
    }
    table.appendChild(tbody);
    wrap.appendChild(table);

    const spacer = document.createElement('div');
    spacer.className = 'footer-space';
    wrap.appendChild(spacer);
  }

  render();

  // --- "Hammasini to'g'ri qilish" ---
  document.getElementById('resetAllBtn').addEventListener('click', () => {
    state.answers = Array.from({ length: nStudents }, () => Array(nItems).fill('1'));
    render();
  });

  // --- Ma'lumotni yig'ish va yuborish ---
  function buildPayload() {
    return {
      class: className,
      n_items: nItems,
      students: state.names.map((name, i) => ({
        name: name && name.trim() ? name.trim() : `O'quvchi ${i + 1}`,
        answers: state.answers[i].join(''),
      })),
    };
  }

  function submit() {
    const payload = buildPayload();
    const json = JSON.stringify(payload);
    if (tg) {
      tg.sendData(json);
      tg.close();
    } else {
      // Telegram tashqarisida ochilgan bo'lsa (masalan test uchun brauzerda) —
      // konsolga chiqaramiz, chunki sendData faqat Telegram ichida ishlaydi.
      console.log('Yuborilgan payload (Telegram tashqarisida, faqat ko\'rish uchun):', payload);
      alert("Bu ilova Telegram ichida ochilganda ma'lumotni botga yuboradi.");
    }
  }

  if (tg) {
    tg.ready();
    tg.expand();
    tg.MainButton.setText('Yuborish');
    tg.MainButton.show();
    tg.MainButton.onClick(submit);
  } else {
    // Telegram tashqarisida sinash uchun pastda oddiy tugma ko'rsatamiz
    const btn = document.createElement('button');
    btn.textContent = 'Yuborish (sinov rejimi)';
    btn.style.cssText = 'position:fixed;bottom:12px;left:16px;right:16px;padding:14px;border-radius:12px;border:none;background:var(--accent);color:var(--accent-text);font-weight:700;font-size:15px;z-index:40;';
    btn.addEventListener('click', submit);
    document.body.appendChild(btn);
  }
})();
</script>

</body>
</html>
